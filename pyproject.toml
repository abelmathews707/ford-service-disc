# Configuration only. fsd has no dependencies and does not need installing —
# clone the repository and run `python3 -m fsd`.

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["site", "extracted", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E741",  # ambiguous variable name: `l` reads fine for a length here
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path is adjusted before importing fsd
